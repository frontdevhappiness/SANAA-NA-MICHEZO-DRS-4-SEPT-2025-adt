  <h1 data-id="pg047_n0004" class="adt-body mb-3 font-normal text-neutral-900">2. Kunyoosha sehemu ya mbele ya paja:</h1><div class="mb-5 space-y-2"><p data-id="pg047_n0005" class="adt-body">(a) Simama kwa mguu mmoja na kunja mguu mwingine kuelekea nyuma;</p><p data-id="pg047_n0006" class="adt-body">(b) Shika kifundo cha mguu ulioinua na kukivuta kuelekea nyuma, kama inavyoonekana katika Kielelezo namba 3;</p><p data-id="pg047_n0007" class="adt-body">(c) Shikilia kwa sekunde 10 hadi 15; na</p><p data-id="pg047_n0008" class="adt-body">(d) Badilisha miguu na kurudia hatua hizo.</p></div>
