              <textarea id="pg080-answer-6" aria-label="Jibu la swali la sita" data-aria-id="pg080-answer-6" data-activity-item="pg080-answer-6" rows="8" class="min-h-48 w-full resize-y rounded-xl border border-sky-300 bg-white/90 p-4 text-neutral-900 focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-200" style="background-image:radial-gradient(circle,#cbd5e1 1.1px,transparent 1.2px);background-size:0.7rem 0.875rem;background-repeat:repeat;background-attachment:local;"></textarea>

    <script type="text/javascript">
      window.correctAnswers = Object.freeze({
        "pg080-name-1": "Penseli",
        "pg080-use-1": "Kuchora picha",
        "pg080-name-2": "Karatasi",
        "pg080-use-2": "Kuchorea picha",
        "pg080-name-3": "Kifutio",
        "pg080-use-3": "Kufuta alama zisizohitajika"
      });

      (() => {
        const root = document.querySelector('section[data-section-id="pg080_sec001"]');
        if (!root) return;

        const expectedTableItemIds = Object.freeze([
          'pg080-name-1', 'pg080-use-1', 'pg080-name-2',
          'pg080-use-2', 'pg080-name-3', 'pg080-use-3'
        ]);
        const tableInputs = Array.from(root.querySelectorAll('[data-merged-activity-kind="fill-table"] input[type="text"][data-activity-item]'));
        const openAnswers = Array.from(root.querySelectorAll('[data-merged-activity-kind="open-ended"] textarea[data-activity-item="pg080-answer-6"]'));
        const openAnswer = openAnswers.length === 1 ? openAnswers[0] : null;
        const status = root.querySelector('#pg080-activity-status');
        const storage = {
          get(key) {
            try { return window.localStorage.getItem(key); } catch (_) { return null; }
          },
          set(key, value) {
            try { window.localStorage.setItem(key, value); } catch (_) { /* Storage can be unavailable in previews. */ }
          }
        };
        const storageKey = (input) => `pg080_sec001_${input.getAttribute('data-aria-id') || input.getAttribute('data-activity-item')}`;
        const normalize = (value) => String(value || '').normalize('NFKC').trim().replace(/\s+/g, ' ').toLocaleLowerCase('sw-TZ');
        const profanityPattern = /(?<![\p{L}\p{N}])(?:fuck|shit|ass|damn|bitch|bastard|cunt|dick|penis|vagina|mierda|puta|pene|pija|boludez|puto|boludo|boluda|joder|carajo|coño|pendejo|culero|verga|polla|chinga|follar|marica|maricon|pinche|cabron|cabrón|culo|gilipollas|pelotudo)(?![\p{L}\p{N}])/iu;
        const keyboardRows = Object.freeze(['qwertyuiop', 'asdfghjkl', 'zxcvbnm']);
        const isAcceptableResponse = (value) => {
          const text = String(value || '').normalize('NFKC').trim();
          if (!text || profanityPattern.test(text)) return false;
          if (/([a-zA-Z])\1{3,}/.test(text)) return false;
          const lower = text.toLowerCase();
          const hasKeyboardMashing = keyboardRows.some((row) => {
            for (let index = 0; index <= row.length - 4; index += 1) {
              if (lower.includes(row.slice(index, index + 4))) return true;
            }
            return false;
          });
          if (hasKeyboardMashing) return false;
          const letters = lower.replace(/[^a-zñáéíóúü]/g, '');
          if (letters.length >= 4) {
            const vowelCount = (letters.match(/[aeiouáéíóúü]/g) || []).length;
            const ratio = vowelCount / letters.length;
            if (ratio < 0.1 || ratio > 0.8) return false;
          }
          const words = text.split(/\s+/).filter(Boolean);
          return words.length < 2 || !words.some((word) => word.length > 20 && !/[-_]/.test(word));
        };
        let announcementTimer = null;
        const announceResult = (message) => {
          if (!status) return;
          window.clearTimeout(announcementTimer);
          status.textContent = '';
          announcementTimer = window.setTimeout(() => { status.textContent = message; }, 0);
        };
        const clearResult = () => {
          window.clearTimeout(announcementTimer);
          if (status) status.textContent = '';
        };
        const markInput = (input, valid) => {
          input.classList.remove('border-green-500', 'border-red-500');
          input.classList.add(valid ? 'border-green-500' : 'border-red-500');
          input.setAttribute('aria-invalid', valid ? 'false' : 'true');
        };
        const clearInput = (input) => {
          input.classList.remove('border-green-500', 'border-red-500');
          input.setAttribute('aria-invalid', 'false');
        };

        [...tableInputs, openAnswer].filter(Boolean).forEach((input) => {
          const key = storageKey(input);
          let saved = storage.get(key);
          if (saved === null && input === openAnswer) {
            saved = storage.get('pg080_sec002_pg080-answer-6');
            if (saved !== null) storage.set(key, saved);
          }
          if (saved !== null) input.value = saved;
          input.addEventListener('input', () => {
            clearInput(input);
            clearResult();
            storage.set(key, input.value);
          });
        });

        const validate = () => {
          const answerKeys = Object.keys(window.correctAnswers);
          const structureValid = tableInputs.length === expectedTableItemIds.length
            && expectedTableItemIds.every((itemId, index) => tableInputs[index]?.getAttribute('data-activity-item') === itemId)
            && answerKeys.length === expectedTableItemIds.length
            && expectedTableItemIds.every((itemId, index) => answerKeys[index] === itemId)
            && openAnswers.length === 1
            && openAnswer?.id === 'pg080-answer-6'
            && openAnswer?.getAttribute('data-aria-id') === 'pg080-answer-6';
          let allPass = structureValid;
          let firstInvalid = null;

          tableInputs.forEach((input) => {
            const itemId = input.getAttribute('data-activity-item');
            const valid = normalize(input.value) === normalize(window.correctAnswers[itemId]);
            markInput(input, valid);
            if (!valid) {
              allPass = false;
              firstInvalid ||= input;
            }
          });

          if (openAnswer) {
            const valid = isAcceptableResponse(openAnswer.value);
            markInput(openAnswer, valid);
            if (!valid) {
              allPass = false;
              firstInvalid ||= openAnswer;
            }
          } else {
            allPass = false;
          }

          announceResult(allPass
            ? 'Majibu yote yamekubaliwa.'
            : 'Baadhi ya majibu hayajakamilika au yanahitaji kurekebishwa.');
          if (!allPass) firstInvalid?.focus();
          return allPass;
        };

        window.__adtPendingCustomActivities = window.__adtPendingCustomActivities || [];
        window.__adtPendingCustomActivities.push({ section: root, handlers: { validate } });
      })();
    </script>
